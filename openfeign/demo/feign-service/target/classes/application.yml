server:
  port: 8701
spring:
  application:
    name: feign-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      nacos-user-service:
        connectTimeout: 1000
        readTimeout: 3000
        loggerLevel: full
