server:
  port: 9402

spring:
  application:
    name: sa-token-login-service
  redis:
    host: localhost
    port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

auth:
  demo:
    username: admin
    password-hash: ${AUTH_DEMO_PASSWORD_HASH}
    admin-id: 10001
